<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Kashmir Grooming Lounge · Pampore, Kashmir</title>
    <script>
      // Single Page Application redirect for GitHub Pages 404 handler
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; background: #FAF8F5; color: #233A30; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading Kashmir Grooming Lounge...</p>
  </body>
</html>
